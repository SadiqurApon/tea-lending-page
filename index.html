<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manrope font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        .manrope-normal {
            font-family: "Manrope", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>

<body class="manrope-normal">
    <main class="max-w-5xl mx-auto px-16 lg:px-20">
        <!-- Header section -->
        <header class="flex items-center">
            <div class="space-y-4">
                <h1 class="font-extrabold text-5xl md:text-7xl text-[#1C1C1C]">It's good <br>
                    tea time at The <br> Tea House</h1>
                <p class="font-medium text-sm text-[#777777] w-3/4">Tea and Botanical Solutions Supplier Give Optimum
                    Satisfaction To Your Taste Buds.</p>
                <button
                    class="font-bold text-sm text-[#FFFFFF] bg-linear-to-r from-[#FF0000] to-[#FF8938] p-4 rounded-lg ">Explore
                    More </button>
            </div>
            <div class="relative">
                <div>
                    <img class="w-full" src="images/banner.png" alt="none">
                </div>
                <!-- card  -->
                 <div class="bg-white shadow-lg px-2 py-2 md:px-10 lg:py-4 rounded-lg absolute top-28 md:top-60 md:left-32 lg:left-28">
                    <!-- star icon -->
                    <div></div>
                    <!-- text  -->
                     <div>
                        <h2 class="font-extrabold lg:text-2xl">5.00</h2>
                        <p class="font-semibold text-[#777777]">Trust Pilot Ratings</p>
                     </div>
                 </div>
            </div>
        </header>
    </main>
</body>

</html>
